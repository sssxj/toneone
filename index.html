<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0910">
<meta name="description" content="ToneOne 将专业调音经验变成简单易用的游戏声音方案。选择游戏，一键优化脚步、细节与空间定位。">
<title>ToneOne — 先听见，再先一步</title>
<style>html{background:#0b0910}body{margin:0;min-height:100vh;background:#0b0910}</style>
</head>
<body>
<script>
(async () => {
  try {
    const urls = Array.from({ length: 14 }, (_, i) => 'parts/' + (i + 1) + '.html');
    const pages = await Promise.all(urls.map(u => fetch(u, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error(u + ' ' + r.status);
      return r.text();
    })));
    const html = pages.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="color:#aaa3b4;font-family:sans-serif;padding:40px">页面加载失败，请刷新重试。</p>';
  }
})();
</script>
</body>
</html>
